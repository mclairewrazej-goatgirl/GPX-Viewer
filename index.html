<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPX Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1f2421; --muted:#6b726e; --line:#e2e4e1; --accent:#2f6b4f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100%; }
  #sidebar { width:320px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  header { padding:16px 16px 12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 0 4px; }
  header p { margin:0; font-size:12px; color:var(--muted); }
  #drop { margin:12px 16px; padding:18px 12px; border:2px dashed var(--line); border-radius:10px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; transition:.15s; }
  #drop:hover, #drop.over { border-color:var(--accent); color:var(--accent); background:#f1f7f3; }
  #drop strong { color:var(--accent); }
  #file { display:none; }
  .sortbar { display:flex; align-items:center; gap:8px; padding:0 16px 10px; font-size:12px; color:var(--muted); }
  .sortbar select { flex:1; font-size:12px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  .date { font-size:12px; color:var(--accent); font-weight:600; margin-top:4px; }
  .nodate { color:var(--muted); font-weight:400; font-style:italic; }
  .coords { margin-top:6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.5; }
  .coords .lbl { display:inline-block; width:58px; color:#888; font-family:system-ui,sans-serif; }
  .coords .cp { cursor:pointer; border-bottom:1px dotted var(--accent); border-radius:2px; padding:0 1px; transition:background .15s; }
  .coords .cp:hover { background:#e3f0e8; }
  .coords .cp.done { background:var(--accent); color:#fff; }
  .coords .hint { display:block; margin-top:3px; font-size:10px; color:#999; font-family:system-ui,sans-serif; }
  .readout { background:rgba(255,255,255,.92); padding:6px 10px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .readout .coords { margin:0; }
  #list { flex:1; overflow-y:auto; padding:0 16px 16px; }
  .empty { font-size:13px; color:var(--muted); text-align:center; margin-top:24px; }
  .item { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .item.hidden { opacity:.5; }
  .row { display:flex; align-items:center; gap:8px; }
  .swatch { width:14px; height:14px; border-radius:50%; flex-shrink:0; border:none; padding:0; cursor:pointer; }
  .name { flex:1; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { border:none; background:none; cursor:pointer; color:var(--muted); font-size:13px; padding:2px 4px; border-radius:4px; }
  .btn:hover { background:#eef0ed; color:var(--ink); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; margin-top:8px; font-size:12px; color:var(--muted); }
  .stats b { color:var(--ink); font-weight:600; }
  .sub { font-size:11px; color:var(--muted); margin-top:6px; }
  footer { padding:10px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .frow { display:flex; gap:8px; }
  .exp { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--muted); }
  .exp button { font-size:11px; padding:2px 8px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; color:var(--ink); }
  .exp button:hover { border-color:var(--accent); color:var(--accent); }
  .pbtn { display:block; margin-top:8px; font-size:12px; padding:4px 8px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  .pbtn:hover { border-color:var(--accent); color:var(--accent); }
  .wedit label { display:block; font-size:11px; color:var(--muted); margin-top:4px; }
  .wedit input, .wedit select { display:block; width:100%; font-size:12px; padding:4px 5px; border:1px solid var(--line); border-radius:4px; margin-top:2px; font-family:inherit; }
  .wedit .two { display:flex; gap:6px; } .wedit .two > * { flex:1; }
  .wedit .grp { font-size:11px; font-weight:600; margin-top:8px; }
  .wedit .msg { font-size:11px; color:#c92a2a; min-height:4px; margin-top:4px; }
  .wedit button { margin-top:6px; font-size:12px; padding:5px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  .wedit button[data-a=save] { background:var(--accent); color:#fff; border-color:var(--accent); }
  footer button { flex:1; font-size:12px; padding:7px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  footer button:hover { border-color:var(--accent); color:var(--accent); }
  #map { flex:1; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#2a2f2c; color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; display:none; z-index:2000; }
  .leaflet-popup-content { font-size:12px; }
  .leaflet-popup-content h4 { margin:0 0 4px; font-size:13px; }
  @media (max-width:700px) {
    #app { flex-direction:column-reverse; }
    #sidebar { width:100%; height:42%; border-right:none; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>GPX Viewer</h1>
      <p>Files stay in your browser. Nothing is uploaded to a server.</p>
    </header>
    <label id="drop" for="file"><strong>Choose GPX, KML or KMZ files</strong> or drag them here</label>
    <input type="file" id="file" accept=".gpx,.kml,.kmz,application/gpx+xml,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" multiple>
    <div class="sortbar">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="date-asc">Date: oldest first</option>
        <option value="date-desc">Date: newest first</option>
        <option value="name">Name (A–Z)</option>
        <option value="added">Order added</option>
      </select>
    </div>
    <div id="list"><div class="empty">No files loaded yet.</div></div>
    <footer>
      <div class="frow">
        <button id="fitAll">Zoom to all</button>
        <button id="clearAll">Clear all</button>
      </div>
      <div class="frow">
        <button id="expAllGpx" title="Save every loaded file together as one GPX">Export all as GPX</button>
        <button id="expAllKml" title="Save every loaded file together as one KML">Export all as KML</button>
      </div>
    </footer>
  </aside>
  <div id="map"></div>
</div>
<div id="toast"></div>

<script>
const COLORS = ['#d7263d','#1b76d1','#2f9e44','#f08c00','#7048e8','#0ca678','#e64980','#495057','#c2255c','#1098ad'];
let colorIdx = 0;
const files = []; // {id, name, color, layer, visible, stats}

// ---------- Map ----------
// OSM's own servers require the page to be served from a website (they block file:// pages),
// so when opened as a local file we default to OpenTopoMap instead.
const isLocalFile = location.protocol === 'file:';
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17, attribution: 'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
});
const sat = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, maxNativeZoom: 18, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
});
const s2 = L.tileLayer('https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg', {
  maxZoom: 19, maxNativeZoom: 15,
  attribution: '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by EOX IT Services GmbH (contains modified Copernicus Sentinel data 2020)'
});
const labels = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, maxNativeZoom: 18, attribution: 'Labels &copy; Esri'
});
const map = L.map('map', { layers: [isLocalFile ? topo : osm] }).setView([51.18, -115.57], 10);
const baseLayers = { 'OpenStreetMap': osm, 'OpenTopoMap': topo, 'Satellite (Esri)': sat, 'Satellite (Sentinel-2, 10 m)': s2 };
L.control.layers(baseLayers, { 'Place labels': labels }).addTo(map);

// Tell the user when a map layer's tiles fail to load (once per layer)
Object.entries({ ...baseLayers, 'Place labels': labels }).forEach(([name, layer]) => {
  let warned = false;
  layer.on('tileerror', () => {
    if (warned) return; warned = true;
    toast(layer === osm && isLocalFile
      ? 'OpenStreetMap only works when this page is hosted on a website. Try another layer, such as OpenTopoMap.'
      : `"${name}" tiles aren't loading. Your network may be blocking that server; try another layer.`);
  });
  layer.on('add', () => { warned = false; });
});
L.control.scale({ imperial: false }).addTo(map);

// Live cursor coordinates
const Readout = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() { this._div = L.DomUtil.create('div', 'readout'); this._div.innerHTML = '<div class="coords">Move over the map</div>'; return this._div; },
  update(ll) { this._div.innerHTML = coordHTML(ll.lat, ll.lng, false); }
});
const readout = new Readout().addTo(map);
map.on('mousemove', e => readout.update(e.latlng));

// Click anywhere on the map for a coordinate popup
map.on('click', e => {
  L.popup().setLatLng(e.latlng).setContent(`<h4>Location</h4>${coordHTML(e.latlng.lat, e.latlng.lng)}`).openOn(map);
});

// ---------- GPX parsing ----------
function parseGPX(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Not valid XML');
  const byTag = (el, tag) => Array.from(el.getElementsByTagNameNS('*', tag));
  const child = (el, tag) => byTag(el, tag)[0];
  const txt = (el, tag) => { const c = child(el, tag); return c ? c.textContent.trim() : ''; };
  const pt = el => ({
    lat: parseFloat(el.getAttribute('lat')),
    lon: parseFloat(el.getAttribute('lon')),
    ele: child(el, 'ele') ? parseFloat(txt(el, 'ele')) : null,
    time: child(el, 'time') ? new Date(txt(el, 'time')) : null
  });

  const lines = [];
  byTag(doc, 'trk').forEach(trk => {
    const name = txt(trk, 'name');
    byTag(trk, 'trkseg').forEach(seg => {
      const pts = byTag(seg, 'trkpt').map(pt).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
      if (pts.length) lines.push({ kind: 'Track', name, pts });
    });
  });
  byTag(doc, 'rte').forEach(rte => {
    const pts = byTag(rte, 'rtept').map(pt).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
    if (pts.length) lines.push({ kind: 'Route', name: txt(rte, 'name'), pts });
  });
  const wpts = byTag(doc, 'wpt').map(w => ({ ...pt(w), name: txt(w, 'name'), desc: txt(w, 'desc') || txt(w, 'cmt') }))
    .filter(p => !isNaN(p.lat) && !isNaN(p.lon));

  // File date: earliest point time, falling back to <metadata><time>
  let date = fileDate(lines, wpts);
  if (!date) {
    const meta = child(doc, 'metadata');
    if (meta && child(meta, 'time')) { const d = new Date(txt(meta, 'time')); if (!isNaN(d)) date = d; }
  }
  return { lines, wpts, date };
}

// Earliest point time in a file, or null
function fileDate(lines, wpts) {
  let date = null;
  [...lines.flatMap(l => l.pts), ...wpts].forEach(p => {
    if (p.time && !isNaN(p.time) && (!date || p.time < date)) date = p.time;
  });
  return date;
}

// ---------- KML parsing ----------
// Reads Placemarks: Point -> waypoint, LineString / gx:Track -> track, Polygon -> area (outer edge only).
// MultiGeometry and gx:MultiTrack are split into their parts. Styles, icons and folders are ignored.
function parseKML(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Not valid XML');
  const byTag = (el, tag) => Array.from(el.getElementsByTagNameNS('*', tag));
  const kids = (el, tag) => Array.from(el.children).filter(c => c.localName === tag);
  const kid = (el, tag) => kids(el, tag)[0];
  const txt = (el, tag) => { const c = kid(el, tag); return c ? c.textContent.trim() : ''; };
  const date = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d : null; };
  // "lon,lat[,alt] lon,lat[,alt] ..."
  const coords = el => {
    const c = el && kid(el, 'coordinates');
    if (!c) return [];
    return c.textContent.trim().split(/\s+/).map(t => {
      const [lon, lat, alt] = t.split(',').map(Number);
      return { lat, lon, ele: alt != null && !isNaN(alt) ? alt : null, time: null };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
  };

  const lines = [], wpts = [];
  byTag(doc, 'Placemark').forEach(pm => {
    const name = txt(pm, 'name');
    const desc = txt(pm, 'description').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    const ts = kid(pm, 'TimeStamp'), span = kid(pm, 'TimeSpan');
    const when = date(ts ? txt(ts, 'when') : span ? txt(span, 'begin') : '');

    const geoms = [];
    const collect = el => Array.from(el.children).forEach(g => {
      if (g.localName === 'MultiGeometry' || g.localName === 'MultiTrack') collect(g);
      else if (['Point','LineString','LinearRing','Polygon','Track'].includes(g.localName)) geoms.push(g);
    });
    collect(pm);

    geoms.forEach(g => {
      if (g.localName === 'Point') {
        const p = coords(g)[0];
        if (p) wpts.push({ ...p, time: when, name, desc });
      } else if (g.localName === 'Track') {
        // gx:Track: <when> times paired with <gx:coord>"lon lat alt"</gx:coord>
        const times = kids(g, 'when').map(w => date(w.textContent.trim()));
        const pts = kids(g, 'coord').map((c, i) => {
          const [lon, lat, alt] = c.textContent.trim().split(/\s+/).map(Number);
          return { lat, lon, ele: alt != null && !isNaN(alt) ? alt : null, time: times[i] || null };
        }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
        if (pts.length) lines.push({ kind: 'Track', name, pts });
      } else if (g.localName === 'Polygon') {
        const outer = kid(g, 'outerBoundaryIs');
        const pts = coords(outer && kid(outer, 'LinearRing'));
        if (pts.length) lines.push({ kind: 'Area', name, pts });
      } else {
        const pts = coords(g);
        if (pts.length) lines.push({ kind: g.localName === 'LinearRing' ? 'Area' : 'Track', name, pts });
      }
    });
  });
  return { lines, wpts, date: fileDate(lines, wpts) };
}

// ---------- KMZ (zipped KML) ----------
// Finds the KML inside a .kmz (doc.kml, or else the first .kml) and unzips it with the browser's
// built-in DecompressionStream, so no extra library is needed.
async function kmlFromKMZ(buf) {
  const dv = new DataView(buf), bytes = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid KMZ (zip) file');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries.push({ name, method, size, local });
    p += 46 + nameLen + extraLen + commentLen;
  }
  const kmls = entries.filter(e => /\.kml$/i.test(e.name));
  const e = kmls.find(e => /(^|\/)doc\.kml$/i.test(e.name)) || kmls[0];
  if (!e) throw new Error('No KML found inside the KMZ');
  const start = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
  const data = bytes.subarray(start, start + e.size);
  if (e.method === 0) return new TextDecoder().decode(data);
  if (e.method !== 8) throw new Error('Unsupported compression in KMZ');
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser is too old to open KMZ files; try a KML instead');
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}

// ---------- Export (GPX / KML) ----------
const xmlEsc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const hasEle = p => p.ele != null && !isNaN(p.ele);
const hasTime = p => p.time && !isNaN(p.time);

function toGPX(list) {
  const pt = (tag, p, extra = '') => `<${tag} lat="${p.lat}" lon="${p.lon}">`
    + (hasEle(p) ? `<ele>${p.ele}</ele>` : '') + (hasTime(p) ? `<time>${p.time.toISOString()}</time>` : '') + extra + `</${tag}>`;
  const out = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<gpx version="1.1" creator="GPX Viewer" xmlns="http://www.topografix.com/GPX/1/1">'];
  if (list.length === 1) out.push(`  <metadata><name>${xmlEsc(list[0].name)}</name></metadata>`);
  list.forEach(f => f.data.wpts.forEach(w => out.push('  ' + pt('wpt', w,
    (w.name ? `<name>${xmlEsc(w.name)}</name>` : '') + (w.desc ? `<desc>${xmlEsc(w.desc)}</desc>` : '')))));
  list.forEach(f => f.data.lines.filter(l => l.kind === 'Route').forEach(l => {
    out.push(`  <rte>${l.name ? `<name>${xmlEsc(l.name)}</name>` : ''}`);
    l.pts.forEach(p => out.push('    ' + pt('rtept', p)));
    out.push('  </rte>');
  }));
  // Tracks and areas both become GPX tracks (GPX has no polygons)
  list.forEach(f => f.data.lines.filter(l => l.kind !== 'Route').forEach(l => {
    out.push(`  <trk>${l.name ? `<name>${xmlEsc(l.name)}</name>` : ''}<trkseg>`);
    l.pts.forEach(p => out.push('    ' + pt('trkpt', p)));
    out.push('  </trkseg></trk>');
  }));
  out.push('</gpx>');
  return out.join('\n');
}

function toKML(list, title) {
  // KML colours are aabbggrr
  const kmlColor = hex => 'ff' + hex.slice(5, 7) + hex.slice(3, 5) + hex.slice(1, 3);
  const c = p => `${p.lon},${p.lat}${hasEle(p) ? ',' + p.ele : ''}`;
  const out = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:gx="http://www.google.com/kml/ext/2.2">',
    `<Document><name>${xmlEsc(title)}</name>`];
  list.forEach((f, i) => {
    out.push(`<Style id="s${i}"><LineStyle><color>${kmlColor(f.color)}</color><width>4</width></LineStyle>`
      + `<PolyStyle><color>40${kmlColor(f.color).slice(2)}</color></PolyStyle>`
      + `<IconStyle><color>${kmlColor(f.color)}</color></IconStyle></Style>`);
  });
  list.forEach((f, i) => {
    if (list.length > 1) out.push(`<Folder><name>${xmlEsc(f.name)}</name>`);
    f.data.wpts.forEach(w => out.push(`<Placemark>${w.name ? `<name>${xmlEsc(w.name)}</name>` : ''}`
      + (w.desc ? `<description>${xmlEsc(w.desc)}</description>` : '')
      + (hasTime(w) ? `<TimeStamp><when>${w.time.toISOString()}</when></TimeStamp>` : '')
      + `<styleUrl>#s${i}</styleUrl><Point><coordinates>${c(w)}</coordinates></Point></Placemark>`));
    f.data.lines.forEach(l => {
      const head = `<Placemark><name>${xmlEsc(l.name || l.kind)}</name><styleUrl>#s${i}</styleUrl>`;
      if (l.kind === 'Area') {
        out.push(head + `<Polygon><outerBoundaryIs><LinearRing><coordinates>${l.pts.map(c).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`);
      } else if (l.kind === 'Track' && l.pts.every(hasTime)) {
        // gx:Track keeps the time of every point
        out.push(head + '<gx:Track>' + (l.pts.some(hasEle) ? '<altitudeMode>clampToGround</altitudeMode>' : '')
          + l.pts.map(p => `<when>${p.time.toISOString()}</when>`).join('')
          + l.pts.map(p => `<gx:coord>${p.lon} ${p.lat}${hasEle(p) ? ' ' + p.ele : ''}</gx:coord>`).join('')
          + '</gx:Track></Placemark>');
      } else {
        out.push(head + `<LineString><coordinates>${l.pts.map(c).join(' ')}</coordinates></LineString></Placemark>`);
      }
    });
    if (list.length > 1) out.push('</Folder>');
  });
  out.push('</Document></kml>');
  return out.join('\n');
}

function exportFiles(list, format) {
  if (!list.length) { toast('No files to export'); return; }
  const base = list.length === 1 ? list[0].name.replace(/\.(gpx|kml|kmz)$/i, '') : 'GPX-Viewer-export';
  const text = format === 'kml' ? toKML(list, base) : toGPX(list);
  const blob = new Blob([text], { type: format === 'kml' ? 'application/vnd.google-earth.kml+xml' : 'application/gpx+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${base}.${format}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Coordinates (WGS84 -> UTM) ----------
function toUTM(lat, lon) {
  if (lat < -80 || lat > 84) return null;
  let zone = Math.floor((lon + 180) / 6) + 1;
  if (zone > 60) zone = 60;
  if (lat >= 56 && lat < 64 && lon >= 3 && lon < 12) zone = 32;
  if (lat >= 72 && lat < 84) {
    if (lon >= 0 && lon < 9) zone = 31; else if (lon >= 9 && lon < 21) zone = 33;
    else if (lon >= 21 && lon < 33) zone = 35; else if (lon >= 33 && lon < 42) zone = 37;
  }
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2), rad = Math.PI / 180;
  const phi = lat * rad, lam = lon * rad, lam0 = ((zone - 1) * 6 - 180 + 3) * rad;
  const sin = Math.sin(phi), cos = Math.cos(phi), tan = Math.tan(phi);
  const N = a / Math.sqrt(1 - e2 * sin * sin), T = tan * tan, C = ep2 * cos * cos, A = cos * (lam - lam0);
  const M = a * ((1 - e2/4 - 3*e2*e2/64 - 5*e2**3/256) * phi
    - (3*e2/8 + 3*e2*e2/32 + 45*e2**3/1024) * Math.sin(2*phi)
    + (15*e2*e2/256 + 45*e2**3/1024) * Math.sin(4*phi)
    - (35*e2**3/3072) * Math.sin(6*phi));
  const easting = k0 * N * (A + (1 - T + C) * A**3 / 6 + (5 - 18*T + T*T + 72*C - 58*ep2) * A**5 / 120) + 500000;
  let northing = k0 * (M + N * tan * (A*A/2 + (5 - T + 9*C + 4*C*C) * A**4 / 24
    + (61 - 58*T + T*T + 600*C - 330*ep2) * A**6 / 720));
  if (lat < 0) northing += 10000000;
  const band = 'CDEFGHJKLMNPQRSTUVWXX'[Math.floor((lat + 80) / 8)];
  return { zone, band, easting, northing };
}
// UTM -> WGS84 lat/long. hemi is 'N' or 'S' (hemisphere, not the band letter).
function fromUTM(zone, hemi, easting, northing) {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2), e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const x = easting - 500000, y = hemi === 'S' ? northing - 10000000 : northing;
  const M = y / k0, mu = M / (a * (1 - e2/4 - 3*e2*e2/64 - 5*e2**3/256));
  const phi1 = mu + (3*e1/2 - 27*e1**3/32) * Math.sin(2*mu) + (21*e1*e1/16 - 55*e1**4/32) * Math.sin(4*mu)
    + (151*e1**3/96) * Math.sin(6*mu) + (1097*e1**4/512) * Math.sin(8*mu);
  const sin = Math.sin(phi1), cos = Math.cos(phi1), tan = Math.tan(phi1);
  const N1 = a / Math.sqrt(1 - e2*sin*sin), T1 = tan*tan, C1 = ep2*cos*cos, R1 = a*(1 - e2) / (1 - e2*sin*sin)**1.5;
  const D = x / (N1 * k0);
  const lat = phi1 - (N1*tan/R1) * (D*D/2 - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*ep2) * D**4/24
    + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*ep2 - 3*C1*C1) * D**6/720);
  const lon = (D - (1 + 2*T1 + C1) * D**3/6 + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*ep2 + 24*T1*T1) * D**5/120) / cos;
  return { lat: lat * 180 / Math.PI, lon: (zone - 1) * 6 - 180 + 3 + lon * 180 / Math.PI };
}
function fmtLatLon(lat, lon) { return `${lat.toFixed(6)}, ${lon.toFixed(6)}`; }
function fmtUTM(lat, lon) {
  const u = toUTM(lat, lon);
  return u ? `${u.zone}${u.band} ${Math.round(u.easting)}E ${Math.round(u.northing)}N` : 'n/a (polar)';
}
// In popups each number is clickable and copies just that number (no zone, no E/N letters).
// The cursor readout (copyable = false) stays plain text.
function coordHTML(lat, lon, copyable = true) {
  if (!copyable) return `<div class="coords"><span class="lbl">Lat/Long</span> ${fmtLatLon(lat, lon)}<br><span class="lbl">UTM</span> ${fmtUTM(lat, lon)}</div>`;
  const cp = (label, v) => `<span class="cp" data-copy="${v}" data-label="${label}" title="Click to copy ${label.toLowerCase()}">${v}</span>`;
  const u = toUTM(lat, lon);
  const utm = u ? `${u.zone}${u.band} ${cp('Easting', Math.round(u.easting))}E ${cp('Northing', Math.round(u.northing))}N` : 'n/a (polar)';
  return `<div class="coords"><span class="lbl">Lat/Long</span> ${cp('Latitude', lat.toFixed(6))}, ${cp('Longitude', lon.toFixed(6))}`
    + `<br><span class="lbl">UTM</span> ${utm}<span class="hint">Click a number to copy it</span></div>`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  // Fallback for browsers/contexts without the async clipboard API
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}

function haversine(a, b) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function lineStats(pts) {
  let dist = 0, gain = 0, loss = 0, minE = Infinity, maxE = -Infinity;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (p.ele != null && !isNaN(p.ele)) { minE = Math.min(minE, p.ele); maxE = Math.max(maxE, p.ele); }
    if (i) {
      dist += haversine(pts[i-1], p);
      const e0 = pts[i-1].ele, e1 = p.ele;
      if (e0 != null && e1 != null && !isNaN(e0) && !isNaN(e1)) { const d = e1 - e0; d > 0 ? gain += d : loss -= d; }
    }
  }
  const times = pts.map(p => p.time).filter(t => t && !isNaN(t));
  const start = times.length ? times[0] : null, end = times.length ? times[times.length-1] : null;
  return { dist, gain, loss, minE, maxE, start, end, n: pts.length };
}

function combine(statsList) {
  const c = { dist:0, gain:0, loss:0, minE:Infinity, maxE:-Infinity, start:null, end:null, n:0 };
  statsList.forEach(s => {
    c.dist += s.dist; c.gain += s.gain; c.loss += s.loss; c.n += s.n;
    c.minE = Math.min(c.minE, s.minE); c.maxE = Math.max(c.maxE, s.maxE);
    if (s.start && (!c.start || s.start < c.start)) c.start = s.start;
    if (s.end && (!c.end || s.end > c.end)) c.end = s.end;
  });
  return c;
}

// ---------- Formatting ----------
const fmtKm = m => m >= 1000 ? (m/1000).toFixed(2) + ' km' : Math.round(m) + ' m';
const fmtM = m => isFinite(m) ? Math.round(m).toLocaleString() + ' m' : '—';
function fmtDur(ms) {
  if (!ms || ms < 0) return '—';
  const m = Math.round(ms / 60000), h = Math.floor(m / 60);
  return h ? `${h}h ${String(m % 60).padStart(2,'0')}m` : `${m}m`;
}
const fmtDate = d => d ? d.toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }) : '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Adding files ----------
function addFile(name, parsed) {
  if (!parsed.lines.length && !parsed.wpts.length) { toast(`${name} has no tracks, routes or waypoints`); return; }

  const color = COLORS[colorIdx++ % COLORS.length];
  const group = L.featureGroup();
  const statsList = [];

  parsed.lines.forEach(line => {
    const s = lineStats(line.pts);
    statsList.push(s);
    const poly = L.polyline(line.pts.map(p => [p.lat, p.lon]), {
      color, weight: 4, opacity: .85, bubblingMouseEvents: false, dashArray: line.kind === 'Route' ? '8 6' : null
    });
    poly.on('click', e => {
      // nearest recorded point to the click
      let best = line.pts[0], bd = Infinity;
      line.pts.forEach(p => { const d = (p.lat - e.latlng.lat)**2 + (p.lon - e.latlng.lng)**2; if (d < bd) { bd = d; best = p; } });
      L.popup().setLatLng([best.lat, best.lon]).setContent(
        `<h4>${esc(line.name || name)}</h4>${line.kind} · ${fmtKm(s.dist)} · ↑ ${fmtM(s.gain)} ↓ ${fmtM(s.loss)}
        ${s.start ? `<br>${fmtDate(s.start)}` : ''}
        <br><br><b>Nearest point</b>${best.time && !isNaN(best.time) ? ' · ' + fmtDate(best.time) : ''}
        ${best.ele != null && !isNaN(best.ele) ? `<br>Elev: ${fmtM(best.ele)}` : ''}
        ${coordHTML(best.lat, best.lon)}`).openOn(map);
    });
    poly.on('mouseover', () => poly.setStyle({ weight: 7 }));
    poly.on('mouseout', () => poly.setStyle({ weight: 4 }));
    group.addLayer(poly);
    // start / end markers (not for areas, which are closed shapes)
    if (line.kind === 'Area') return;
    const first = line.pts[0], last = line.pts[line.pts.length - 1];
    const endPopup = (label, p) => `<h4>${label}: ${esc(line.name || name)}</h4>${p.time && !isNaN(p.time) ? fmtDate(p.time) + '<br>' : ''}${p.ele != null && !isNaN(p.ele) ? 'Elev: ' + fmtM(p.ele) : ''}${coordHTML(p.lat, p.lon)}`;
    group.addLayer(L.circleMarker([first.lat, first.lon], { bubblingMouseEvents:false, radius:5, color:'#fff', weight:2, fillColor:color, fillOpacity:1 }).bindTooltip('Start').bindPopup(endPopup('Start', first)));
    group.addLayer(L.circleMarker([last.lat, last.lon], { bubblingMouseEvents:false, radius:5, color:color, weight:2, fillColor:'#fff', fillOpacity:1 }).bindTooltip('End').bindPopup(endPopup('End', last)));
  });

  parsed.wpts.forEach(w => group.addLayer(waypointMarker(w, color)));

  group.addTo(map);
  const entry = {
    id: Date.now() + Math.random(), added: files.length ? Math.max(...files.map(f => f.added)) + 1 : 0,
    date: parsed.date, name, color, layer: group, visible: true, data: parsed,
    stats: statsList.length ? combine(statsList) : null,
    counts: { tracks: parsed.lines.filter(l => l.kind === 'Track').length, routes: parsed.lines.filter(l => l.kind === 'Route').length, areas: parsed.lines.filter(l => l.kind === 'Area').length, wpts: parsed.wpts.length }
  };
  files.push(entry);
  render();
  return entry;
}

// ---------- Waypoints (with editing) ----------
// The waypoint object `w` is the same one export uses, so edits are included when you export.
function waypointMarker(w, color) {
  const m = L.circleMarker([w.lat, w.lon], { bubblingMouseEvents:false, radius:6, color:'#fff', weight:2, fillColor:color, fillOpacity:1 });
  const view = () => {
    const div = document.createElement('div');
    div.innerHTML = `<h4>${esc(w.name || 'Waypoint')}</h4>${w.desc ? esc(w.desc) + '<br>' : ''}
      ${w.time && !isNaN(w.time) ? fmtDate(w.time) + '<br>' : ''}${w.ele != null && !isNaN(w.ele) ? `Elev: ${fmtM(w.ele)}` : ''}
      ${coordHTML(w.lat, w.lon)}<button class="pbtn" type="button">✎ Edit waypoint</button>`;
    div.querySelector('.pbtn').onclick = () => m.setPopupContent(editor());
    // The button is gone once the editor replaces it, so stop the click here or the map
    // would treat it as a click on the map and open a "Location" popup instead.
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  const editor = () => {
    const u = toUTM(w.lat, w.lon);
    const div = document.createElement('div');
    div.className = 'wedit';
    div.innerHTML = `<h4>Edit waypoint</h4>
      <label>Name<input data-f="name" value="${esc(w.name || '')}"></label>
      <div class="grp">Lat/Long (decimal degrees)</div>
      <div class="two"><label>Latitude<input data-f="lat" inputmode="decimal" value="${w.lat.toFixed(6)}"></label>
        <label>Longitude<input data-f="lon" inputmode="decimal" value="${w.lon.toFixed(6)}"></label></div>
      <div class="grp">UTM</div>
      <div class="two"><label>Zone<input data-f="zone" inputmode="numeric" value="${u ? u.zone : ''}"></label>
        <label>Hemisphere<select data-f="hemi"><option value="N">N (north)</option><option value="S"${w.lat < 0 ? ' selected' : ''}>S (south)</option></select></label></div>
      <div class="two"><label>Easting<input data-f="e" inputmode="numeric" value="${u ? Math.round(u.easting) : ''}"></label>
        <label>Northing<input data-f="n" inputmode="numeric" value="${u ? Math.round(u.northing) : ''}"></label></div>
      <div class="msg"></div>
      <div class="two"><button type="button" data-a="save">Save</button><button type="button" data-a="cancel">Cancel</button></div>`;
    const f = k => div.querySelector(`[data-f=${k}]`);
    const msg = div.querySelector('.msg');
    const num = k => { const v = f(k).value.trim(); return v === '' ? NaN : Number(v); };
    const llOk = (lat, lon) => isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    // Typing in one system fills in the other
    const fromLL = () => {
      const lat = num('lat'), lon = num('lon');
      if (!llOk(lat, lon)) { msg.textContent = 'Latitude must be -90 to 90 and longitude -180 to 180.'; return; }
      msg.textContent = '';
      const u = toUTM(lat, lon);
      if (!u) { msg.textContent = 'UTM not available this close to the poles.'; return; }
      f('zone').value = u.zone; f('hemi').value = lat < 0 ? 'S' : 'N';
      f('e').value = Math.round(u.easting); f('n').value = Math.round(u.northing);
    };
    const fromUTMFields = () => {
      const zone = num('zone'), e = num('e'), n = num('n');
      if (!(Number.isInteger(zone) && zone >= 1 && zone <= 60) || !isFinite(e) || !isFinite(n) || e < 100000 || e > 900000 || n < 0 || n > 10000000) {
        msg.textContent = 'Zone must be 1 to 60, easting about 100000 to 900000, and northing 0 to 10000000.'; return;
      }
      msg.textContent = '';
      const ll = fromUTM(zone, f('hemi').value, e, n);
      f('lat').value = ll.lat.toFixed(6); f('lon').value = ll.lon.toFixed(6);
    };
    ['lat','lon'].forEach(k => f(k).addEventListener('input', fromLL));
    ['zone','e','n'].forEach(k => f(k).addEventListener('input', fromUTMFields));
    f('hemi').addEventListener('change', fromUTMFields);
    div.querySelector('[data-a=cancel]').onclick = () => m.setPopupContent(view());
    div.querySelector('[data-a=save]').onclick = () => {
      const lat = num('lat'), lon = num('lon');
      if (!llOk(lat, lon)) { msg.textContent = 'Please fix the coordinates before saving.'; return; }
      w.name = f('name').value.trim(); w.lat = lat; w.lon = lon;
      m.setLatLng([lat, lon]);
      m.unbindTooltip(); if (w.name) m.bindTooltip(esc(w.name));
      m.setPopupContent(view());
      m.getPopup().setLatLng([lat, lon]);
      toast('Waypoint updated. Use Export to save a copy of the file.');
    };
    // Stop map shortcuts (like +/-) and clicks from firing while typing
    L.DomEvent.disableClickPropagation(div);
    div.addEventListener('keydown', e => e.stopPropagation());
    return div;
  };
  m.bindPopup(view, { minWidth: 230 });
  m.on('popupclose', () => m.setPopupContent(view));
  if (w.name) m.bindTooltip(esc(w.name));
  return m;
}

function handleFiles(fileList) {
  const all = Array.from(fileList);
  const ok = all.filter(f => /\.(gpx|kml|kmz)$/i.test(f.name) || /gpx|kml|kmz/.test(f.type));
  if (!ok.length) { toast('Please choose .gpx, .kml or .kmz files'); return; }
  const skipped = all.length - ok.length;
  if (skipped) toast(`Skipped ${skipped} file${skipped > 1 ? 's' : ''} that ${skipped > 1 ? "aren't" : "isn't"} GPX, KML or KMZ`);
  Promise.all(ok.map(async f => {
    try {
      const isKMZ = /\.kmz$/i.test(f.name) || f.type.includes('kmz');
      const text = isKMZ ? await kmlFromKMZ(await f.arrayBuffer()) : await f.text();
      const isKML = isKMZ || /\.kml$/i.test(f.name) || f.type.includes('kml') || /<kml[\s>]/.test(text.slice(0, 2000));
      addFile(f.name, isKML ? parseKML(text) : parseGPX(text));
    } catch (e) { toast(`Couldn't read ${f.name}: ${e.message}`); }
  })).then(fitAll);
}

// ---------- Sidebar ----------
function render() {
  const list = document.getElementById('list');
  if (!files.length) { list.innerHTML = '<div class="empty">No files loaded yet.</div>'; return; }
  list.innerHTML = '';
  const mode = document.getElementById('sort').value;
  const byDate = dir => (a, b) => {
    if (!a.date && !b.date) return a.added - b.added;
    if (!a.date) return 1; if (!b.date) return -1;   // undated files always last
    return dir * (a.date - b.date);
  };
  const sorted = [...files].sort(
    mode === 'date-asc' ? byDate(1) : mode === 'date-desc' ? byDate(-1)
    : mode === 'name' ? (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true })
    : (a, b) => a.added - b.added);
  sorted.forEach(f => {
    const s = f.stats;
    const parts = [];
    if (f.counts.tracks) parts.push(`${f.counts.tracks} track${f.counts.tracks > 1 ? 's' : ''}`);
    if (f.counts.routes) parts.push(`${f.counts.routes} route${f.counts.routes > 1 ? 's' : ''}`);
    if (f.counts.areas) parts.push(`${f.counts.areas} area${f.counts.areas > 1 ? 's' : ''}`);
    if (f.counts.wpts) parts.push(`${f.counts.wpts} waypoint${f.counts.wpts > 1 ? 's' : ''}`);
    const div = document.createElement('div');
    div.className = 'item' + (f.visible ? '' : ' hidden');
    div.innerHTML = `
      <div class="row">
        <button class="swatch" style="background:${f.color}" title="Change colour"></button>
        <div class="name" title="${esc(f.name)}">${esc(f.name)}</div>
        <button class="btn" data-a="zoom" title="Zoom to">⌖</button>
        <button class="btn" data-a="toggle" title="Show/hide">${f.visible ? '👁' : '◌'}</button>
        <button class="btn" data-a="remove" title="Remove">✕</button>
      </div>
      <div class="date">${f.date ? f.date.toLocaleDateString(undefined, { weekday:'short', year:'numeric', month:'short', day:'numeric' }) + ' · ' + f.date.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' }) : '<span class="nodate">No date in file</span>'}</div>
      ${s ? `<div class="stats">
        <span>Distance <b>${fmtKm(s.dist)}</b></span>
        <span>Duration <b>${fmtDur(s.start && s.end ? s.end - s.start : 0)}</b></span>
        <span>Gain <b>${fmtM(s.gain)}</b></span>
        <span>Loss <b>${fmtM(s.loss)}</b></span>
        <span>Min elev <b>${fmtM(s.minE)}</b></span>
        <span>Max elev <b>${fmtM(s.maxE)}</b></span>
      </div>` : ''}
      <div class="sub">${parts.join(' · ')}</div>
      <div class="exp">Export <button data-a="gpx">GPX</button><button data-a="kml">KML</button></div>`;
    div.querySelector('[data-a=zoom]').onclick = () => zoomTo(f);
    div.querySelector('[data-a=gpx]').onclick = () => exportFiles([f], 'gpx');
    div.querySelector('[data-a=kml]').onclick = () => exportFiles([f], 'kml');
    div.querySelector('[data-a=toggle]').onclick = () => {
      f.visible = !f.visible;
      f.visible ? f.layer.addTo(map) : map.removeLayer(f.layer);
      render();
    };
    div.querySelector('[data-a=remove]').onclick = () => {
      map.removeLayer(f.layer);
      files.splice(files.indexOf(f), 1);
      render();
    };
    div.querySelector('.swatch').onclick = () => {
      f.color = COLORS[(COLORS.indexOf(f.color) + 1) % COLORS.length];
      f.layer.eachLayer(l => {
        if (l instanceof L.Polyline) l.setStyle({ color: f.color });
        else if (l.options.fillColor === '#fff') l.setStyle({ color: f.color });
        else l.setStyle({ fillColor: f.color });
      });
      render();
    };
    list.appendChild(div);
  });
}

function zoomTo(f) {
  if (!f.visible) { f.visible = true; f.layer.addTo(map); render(); }
  const b = f.layer.getBounds();
  if (b.isValid()) map.fitBounds(b, { padding: [30, 30], maxZoom: 16 });
}
function fitAll() {
  const b = L.latLngBounds([]);
  files.filter(f => f.visible).forEach(f => b.extend(f.layer.getBounds()));
  if (b.isValid()) map.fitBounds(b, { padding: [30, 30], maxZoom: 16 });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3500);
}

// ---------- Events ----------
// iOS/Android often don't recognise .gpx/.kml and grey the files out when "accept" is set,
// so on touch devices allow any file; other files are filtered out in handleFiles().
if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
  document.getElementById('file').removeAttribute('accept');
}
document.getElementById('file').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
document.getElementById('fitAll').onclick = fitAll;
document.getElementById('expAllGpx').onclick = () => exportFiles(files, 'gpx');
document.getElementById('expAllKml').onclick = () => exportFiles(files, 'kml');
document.getElementById('sort').addEventListener('change', render);

// Click-to-copy numbers in popups. Capture phase, because Leaflet stops clicks inside popups from bubbling.
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.coords .cp');
  if (!el) return;
  e.preventDefault(); e.stopPropagation();
  copyText(el.dataset.copy).then(ok => {
    toast(ok ? `Copied ${el.dataset.label.toLowerCase()}: ${el.dataset.copy}` : "Couldn't copy. Select the number and press Ctrl+C instead.");
    if (!ok) return;
    el.classList.add('done'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('done'), 900);
  });
}, true);
document.getElementById('clearAll').onclick = () => { files.forEach(f => map.removeLayer(f.layer)); files.length = 0; render(); };

const drop = document.getElementById('drop');
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
</script>
</body>
</html>
